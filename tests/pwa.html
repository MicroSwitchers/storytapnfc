<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryTouch PWA verification</title><link rel="icon" href="../assets/icons/storytouch.svg"><link rel="stylesheet" href="../styles.css"><script src="./pwa-browser.js" defer></script></head><body><main><h1>PWA verification</h1><p>Use a separate localhost test origin. Adds only test stories, drafts and links there. The offline stage runs after the local server is stopped; the update stage needs a new worker version and the server restarted.</p><div class="button-row"><button id="pwa-run" class="button dark">1. Check app & cache</button><button id="pwa-offline" class="button outline" disabled>2. Test without server</button><button id="pwa-update" class="button outline" disabled>3. Test app update</button></div><pre id="pwa-results" role="status"></pre><iframe id="pwa-app" title="PWA test app" width="100%" height="950"></iframe></main></body></html>
